AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Visitor Management Portal Serverless Architecture Template
Globals:
  Function:
    Timeout: 30
    Runtime: provided.al2023
    Architectures:
    - x86_64
Resources:
  VisitorManagementTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: VMP_nosql
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
  VMPAPIGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: VMPAPIGateway
      Description: API Gateway for the application redirects traffic to Lambda invocation
      StageName: Dev
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
  VisitorManagementExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: VisitorManagementPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:PartiQLSelect
            - dynamodb:PartiQLInsert
            - dynamodb:PartiQLUpdate
            - dynamodb:PartiQLDelete
            Resource:
              Fn::GetAtt:
              - VisitorManagementTable
              - Arn
  Login:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: Login
    Properties:
      FunctionName: VMP_Auth_Login
      CodeUri: Login
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /api/auth/login
            RestApiId:
              Ref: VMPAPIGateway
  Signup:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: Signup
    Properties:
      FunctionName: VMP_Auth_Signup
      CodeUri: Signup
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /api/auth/signup
            RestApiId:
              Ref: VMPAPIGateway
  CreateUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CreateUser
    Properties:
      FunctionName: VMP_CreateUser
      CodeUri: CreateUser
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /api/users
            RestApiId:
              Ref: VMPAPIGateway
  ListUsers:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListUsers
    Properties:
      FunctionName: VMP_ListUsers
      CodeUri: ListUsers
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /api/users
            RestApiId:
              Ref: VMPAPIGateway
  GetUsersCount:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: GetUsersCount
    Properties:
      FunctionName: VMP_GetOwnerCount
      CodeUri: GetUsersCount
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /api/users/owners/count
            RestApiId:
              Ref: VMPAPIGateway
  GetUserByID:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: GetUserByID
    Properties:
      FunctionName: VMP_GetUserByID
      CodeUri: GetUserByID
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: get
            RestApiId:
              Ref: VMPAPIGateway
  DeleteUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: DeleteUser
    Properties:
      FunctionName: VMP_DeleteUser
      CodeUri: DeleteUser
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /api/users/{user_id}
            Method: delete
            RestApiId:
              Ref: VMPAPIGateway
  CreateGatekeeper:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CreateGatekeeper
    Properties:
      FunctionName: VMP_CreateGatekeeper
      CodeUri: CreateGatekeeper
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /api/create_gatekeeper
            RestApiId:
              Ref: VMPAPIGateway
  DeleteGatekeeper:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: DeleteGatekeeper
    Properties:
      FunctionName: VMP_DeleteGatekeeper
      CodeUri: DeleteGatekeeper
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: delete
            Path: /api/gatekeepers/{user_id}
            RestApiId:
              Ref: VMPAPIGateway
  ListAllGatekeeper:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListAllGatekeeper
    Properties:
      FunctionName: VMP_GetAllGatekeeper
      CodeUri: ListAllGatekeeper
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /api/gatekeepers
            RestApiId:
              Ref: VMPAPIGateway
  CreateVisitor:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CreateVisitor
    Properties:
      FunctionName: VMP_CreateVisitor
      CodeUri: CreateVisitor
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /api/create_visitor
            RestApiId:
              Ref: VMPAPIGateway
  CountVisitors:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: CountVisitors
    Properties:
      FunctionName: VMP_CountVisitors
      CodeUri: CountVisitors
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /api/visitors/count
            RestApiId:
              Ref: VMPAPIGateway
  ListVisitor:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListVisitor
    Properties:
      FunctionName: VMP_ListVisitor
      CodeUri: ListVisitor
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /api/visitors
            RestApiId:
              Ref: VMPAPIGateway
  ListVisitorByOwner:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: ListVisitorByOwner
    Properties:
      FunctionName: VMP_ListVisitorByOwner
      CodeUri: ListVisitorByOwner
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /api/visitors_by_owner
            RestApiId:
              Ref: VMPAPIGateway
  UpdateVisitorStatus:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: UpdateVisitorStatus
    Properties:
      FunctionName: VMP_UpdateVisitorStatus
      CodeUri: UpdateVisitorStatus
      Handler: bootstrap
      Role:
        Fn::GetAtt:
        - VisitorManagementExecutionRole
        - Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: patch
            Path: /api/update_visitor_status
            RestApiId:
              Ref: VMPAPIGateway
